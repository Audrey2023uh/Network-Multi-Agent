name: Deploy ECNetBench Dashboard

on:
  push:
    branches: [main]
    paths:
      - "interactive_dashboard/**"
      - "results/**"
      - "benchmark/INSTANCE_CHECKSUMS.json"
      - ".github/workflows/dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps for data adapter
        run: pip install pandas
      - name: Build dashboard data
        run: python interactive_dashboard/scripts/build_data.py
      - name: Validate data
        run: python interactive_dashboard/scripts/validate_dashboard_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interactive_dashboard/package-lock.json
      - name: Install & build
        working-directory: interactive_dashboard
        run: |
          npm ci || npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interactive_dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
